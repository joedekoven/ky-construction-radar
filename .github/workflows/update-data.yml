name: Update construction data

on:
  schedule:
    # 6:00 AM Eastern (10:00 UTC) every day
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper
        run: python scraper.py

      - name: Commit updated data
        run: |
          git config user.name "construction-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add projects.json geocode_cache.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Automated data refresh $(date -u +%Y-%m-%d)"
          # If the repo changed while we ran, replay our commit on top,
          # keeping OUR freshly scraped data if the same files conflict.
          git pull --rebase -X theirs origin main
          git push origin main
